<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RTP Driller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== DESIGN SYSTEM ===== */
        :root {
            --bg-primary: #000000;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --bg-card: #333340;
            --border-color: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: rgba(255,255,255,0.7);
            --text-muted: rgba(255,255,255,0.4);
            --accent-green: #2ecc40;
            --accent-green-dim: rgba(46, 204, 64, 0.15);
            --accent-red: #e74c3c;
            --accent-red-dim: rgba(231, 76, 60, 0.15);
            --accent-blue: #58a6ff;
            --accent-blue-dim: rgba(88, 166, 255, 0.15);
            --accent-purple: #a371f7;
            --accent-orange: rgba(255, 165, 0, 0.9);
            --accent-gold: rgba(255, 165, 0, 0.9);
            --accent-gold-dim: rgba(255, 165, 0, 0.15);
            --felt-green: #1a612e;
            --felt-line: #267038;
            --rail-light: #4D3820;
            --rail-dark: #332412;
            --card-back: #1a2659;
            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Outfit', sans-serif;
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-pill: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            line-height: 1.5;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        /* ===== LAYOUT ===== */
        .app {
            max-width: 1600px;
            margin: 0 auto;
            padding: 16px;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }


        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: var(--bg-secondary);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            padding: 6px 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: var(--font-sans);
            transition: border-color 0.2s;
        }

        .btn-icon:hover { border-color: rgba(255,255,255,0.4); }

        /* ===== MAIN LAYOUT ===== */
        .main-layout {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        /* ===== CONFIG PANEL ===== */
        .config-panel {
            background: var(--bg-secondary);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 16px;
        }

        .config-body {
            display: flex;
            flex-direction: column;
        }

        .config-group {
            margin-bottom: 16px;
        }

        .config-group:last-child {
            margin-bottom: 0;
        }

        .config-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        .config-options {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .config-btn {
            background: var(--bg-tertiary);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            padding: 8px 14px;
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.15s;
            flex: 1;
            min-width: 50px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .config-btn:hover:not(.disabled) {
            border-color: var(--accent-blue);
        }

        .config-btn.selected {
            background: var(--accent-blue-dim);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .config-btn.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .config-btn.locked {
            opacity: 0.5;
            cursor: default;
        }

        /* ===== TABLE AREA ===== */
        .table-area {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== CONTROL BAR ===== */
        .control-bar {
            display: flex;
            gap: 8px;
            justify-content: center;
            padding: 8px 0;
        }

        .new-hand-btn {
            background: var(--accent-green);
            border: none;
            border-radius: var(--radius-lg);
            color: #fff;
            padding: 12px 32px;
            font-family: var(--font-sans);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .new-hand-btn:hover { opacity: 0.9; }

        .new-street-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: var(--radius-lg);
            color: var(--text-secondary);
            padding: 10px 32px;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, border-color 0.2s;
            width: 100%;
        }
        .new-street-btn:hover { border-color: rgba(255,255,255,0.4); color: #fff; }

        .history-nav {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
        }
        .history-nav-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: var(--radius-lg);
            color: var(--text-secondary);
            padding: 8px 18px;
            font-family: var(--font-sans);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, border-color 0.2s, color 0.2s;
        }
        .history-nav-btn:hover:not(:disabled) { border-color: rgba(255,255,255,0.4); color: #fff; }
        .history-nav-btn:disabled { opacity: 0.3; cursor: default; }

        /* ===== HAND SCREEN ===== */
        .hand-layout {
            display: flex;
            flex-direction: row;
            gap: 20px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .hand-main {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .poker-table-wrapper {
            position: relative;
            width: 100%;
            padding: 60px 40px;
            margin: 0 auto 16px;
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .table-felt {
            background: var(--felt-green);
            /* Stadium capsule: flat long sides + rounded ends */
            border-radius: 999px;
            border: 2px solid rgba(255,255,255,0.15);
            aspect-ratio: 2 / 1;
            width: 100%;
            max-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: visible;
        }

        .table-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 3;
        }

        .board-cards {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* pot-pill styles are in the chip pills section */

        .seat {
            position: absolute;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1.5px solid rgba(255,255,255,0.42);
            font-size: 0.8rem;
            text-align: center;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            isolation: isolate;
            transform: translate(-50%, -50%);
            transition: border-color 0.25s ease-in-out, opacity 0.25s ease-in-out, box-shadow 0.2s ease-in-out;
        }

        .seat.hero {
            border-color: rgba(255, 214, 86, 0.85);
        }

        .seat.status-raised {
            border-color: rgba(255, 165, 0, 0.8);
        }

        .seat.status-called {
            border-color: rgba(88,166,255,0.8);
        }

        .seat.status-posted {
            border-color: rgba(255,255,255,0.55);
        }

        .seat.active-player {
            border-color: rgba(255,255,255,0.38);
            background: var(--bg-card);
            opacity: 1;
        }

        .seat.folded {
            opacity: 0.35;
            border-color: rgba(255,255,255,0.28);
        }

        .seat.folded .dealer-badge {
            opacity: calc(1 / 0.35);
        }


        .seat-position {
            font-weight: 700;
            color: rgba(255,255,255,0.85);
            font-size: 10px;
            line-height: 1;
            white-space: nowrap;
        }

        .seat.folded .seat-position,
        .seat.folded .seat-stack {
            display: none;
        }

        .seat-stack {
            font-weight: 700;
            font-size: 11px;
            color: rgba(255,255,255,0.6);
            line-height: 1;
        }

        .seat-action {
            font-weight: 700;
            font-size: 11px;
            color: #fff;
            line-height: 1;
            animation: seatActionFade 0.2s ease;
        }
        @keyframes seatActionFade {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .seat-hero-label {
            position: absolute;
            bottom: -22px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-orange);
            color: #000;
            font-size: 0.62rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            white-space: nowrap;
            letter-spacing: 0.05em;
            z-index: 30;
        }

        .seat.active-turn {
            border-width: 2px !important;
            border-color: rgba(255,255,255,0.98) !important;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.18), 0 0 10px rgba(255,255,255,0.28);
        }
        .seat.active-turn::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.98);
            box-shadow: 0 0 0 3px rgba(255,255,255,0.18), 0 0 10px rgba(255,255,255,0.28);
            z-index: 40;
            pointer-events: none;
        }

        .dealer-badge {
            position: absolute;
            width: 18px;
            height: 18px;
            background: #ffffff;
            color: #000;
            border-radius: 50%;
            font-size: 9px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.4);
            z-index: 4;
        }
        /* Dealer badge positioned toward table center, same distance as bet pills */
        .seat-pos-0 .dealer-badge { top: -38px; left: 50%; right: auto; transform: translateX(-50%); }
        .seat-pos-1 .dealer-badge { top: -24px; right: -20px; }
        .seat-pos-2 .dealer-badge { top: 50%; right: -50px; left: auto; transform: translateY(-50%); }
        .seat-pos-3 .dealer-badge { bottom: -24px; right: -20px; top: auto; }
        .seat-pos-4 .dealer-badge { bottom: -38px; left: 50%; top: auto; right: auto; transform: translateX(-50%); }
        .seat-pos-5 .dealer-badge { bottom: -24px; left: -20px; top: auto; right: auto; }
        .seat-pos-6 .dealer-badge { top: 50%; left: -50px; right: auto; transform: translateY(-50%); }
        .seat-pos-7 .dealer-badge { top: -24px; left: -20px; right: auto; }

        .hero-hand { display: none; }

        .table-actions-area {
            width: 100%;
            max-width: none;
            margin: 0 auto;
            margin-top: auto;
            padding-top: 16px;
        }


        .cards-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 12px;
        }

        .card {
            background: #fff;
            border-radius: 6px;
            width: 48px;
            height: 68px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: var(--font-sans);
            font-size: 24px;
            font-weight: 700;
            line-height: 1;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .card.facedown {
            background: var(--card-back);
            border: 1px solid rgba(255,255,255,0.3);
            width: 28px;
            height: 38px;
        }

        .card .rank { font-size: 24px; }
        .card .suit { font-size: 24px; }

        .card.red { color: #d32f2f; }
        .card.black { color: #1a1a1a; }

        @keyframes cardDeal {
            from { opacity: 0; transform: scale(0.5) translateY(-20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .board-card.dealing {
            animation: cardDeal 0.4s ease forwards;
        }

        .hero-hand .card.dealing {
            animation: cardDeal 0.4s ease forwards;
        }

        /* ===== STATS BAR ===== */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: var(--bg-secondary);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-lg);
            padding: 12px 16px;
            margin-bottom: 16px;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 1.05rem;
        }

        .stat-value.pot { color: var(--accent-orange); }

        /* ===== ACTION LOG ===== */
        .action-log {
            margin-bottom: 16px;
        }

        .action-entry {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .action-entry:last-child { border-bottom: none; }

        .action-actor {
            font-weight: 600;
            color: var(--text-primary);
            min-width: 60px;
        }

        .action-actor.opponent { color: var(--accent-red); }
        .action-actor.user { color: var(--accent-blue); }

        .action-text { flex: 1; }

        .action-amount {
            font-family: var(--font-mono);
            font-weight: 600;
            color: var(--text-primary);
        }

        /* ===== USER ACTIONS ===== */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
            min-height: 44px;
            opacity: 1;
            transition: opacity 0.25s ease-in-out;
        }

        .action-buttons.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .action-btn {
            flex: 1;
            height: 44px;
            padding: 0 8px;
            border: none;
            border-radius: 10px;
            font-family: var(--font-sans);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            color: #fff;
            transition: opacity 0.15s;
        }

        .action-btn:hover { opacity: 0.85; }

        .action-btn.check {
            background: var(--accent-green);
            color: #fff;
        }

        .action-btn.bet, .action-btn.raise {
            background: var(--accent-red);
            color: #fff;
        }

        .action-btn.call {
            background: var(--accent-green);
            color: #fff;
        }

        .action-btn.fold {
            background: #555;
            color: #fff;
        }

        .action-btn.all-in {
            background: var(--accent-red);
            color: #fff;
        }

        .action-btn-placeholder {
            visibility: hidden;
            pointer-events: none;
        }

        .sizing-area {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
            visibility: hidden;
        }

        .sizing-area.visible { visibility: visible; }

        .sizing-input {
            flex: 1;
            background: var(--bg-secondary);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            padding: 12px;
            font-family: var(--font-mono);
            font-size: 1rem;
            outline: none;
        }

        .sizing-input:focus { border-color: var(--accent-blue); }

        .sizing-input::placeholder { color: var(--text-muted); }

        .sizing-unit {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .sizing-confirm {
            background: var(--accent-green);
            border: none;
            border-radius: var(--radius-md);
            color: #fff;
            padding: 12px 20px;
            font-family: var(--font-sans);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .sizing-confirm:hover { opacity: 0.9; }

        .sizing-error {
            color: var(--accent-red);
            font-size: 0.8rem;
            margin-top: 4px;
            display: none;
        }

        .sizing-error.visible { display: block; }

        /* ===== HAND COMPLETE BANNER ===== */
        .hand-complete-banner {
            text-align: center;
            padding: 10px 16px;
            background: var(--bg-secondary);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-md);
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .hand-complete-banner.won { color: var(--accent-green); }
        .hand-complete-banner.lost { color: var(--accent-red); }

        /* ===== SESSION LOG ===== */
        .session-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 100;
        }

        .session-overlay.open { display: block; }

        .session-drawer {
            position: fixed;
            top: 0; right: 0; bottom: 0;
            width: min(360px, 85vw);
            background: var(--bg-secondary);
            border-left: 1px solid rgba(255,255,255,0.1);
            z-index: 101;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s;
        }

        .session-overlay.open .session-drawer { transform: translateX(0); }

        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .drawer-header h2 { font-size: 1rem; }

        .drawer-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 4px;
        }

        .drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .session-hand-card {
            background: var(--bg-secondary);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-md);
            padding: 12px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .session-hand-num {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .session-hand-details {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .session-hand-details span {
            font-family: var(--font-mono);
            color: var(--text-primary);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 16px;
            font-size: 0.9rem;
        }

        /* ===== CHIP PILLS & PREFLOP ANIMATION ===== */
        .seat-bet-pill {
            position: absolute;
            font-family: var(--font-sans);
            font-size: 9px;
            font-weight: 700;
            color: #000;
            background: #fff;
            border-radius: var(--radius-pill);
            padding: 2px 6px;
            white-space: nowrap;
            z-index: 8;
            opacity: 0;
            transform: scale(0);
            transition: opacity 0.3s, transform 0.3s;
        }
        .seat-bet-pill.visible {
            opacity: 1;
            transform: scale(1);
        }
        .seat-bet-pill.collecting {
            transition: all 0.5s ease-in;
            opacity: 0;
        }
        /* Bet pill positions (relative to each seat, toward table center at ~60% radius) */
        .seat-pos-0 .seat-bet-pill { top: -44px; left: 50%; transform: translateX(-50%) scale(0); }
        .seat-pos-0 .seat-bet-pill.visible { transform: translateX(-50%) scale(1); }
        .seat-pos-1 .seat-bet-pill { top: -28px; right: -24px; }
        .seat-pos-2 .seat-bet-pill { top: 50%; right: -58px; transform: translateY(-50%) scale(0); }
        .seat-pos-2 .seat-bet-pill.visible { transform: translateY(-50%) scale(1); }
        .seat-pos-3 .seat-bet-pill { bottom: -28px; right: -24px; }
        .seat-pos-4 .seat-bet-pill { bottom: -44px; left: 50%; transform: translateX(-50%) scale(0); }
        .seat-pos-4 .seat-bet-pill.visible { transform: translateX(-50%) scale(1); }
        .seat-pos-5 .seat-bet-pill { bottom: -28px; left: -24px; }
        .seat-pos-6 .seat-bet-pill { top: 50%; left: -58px; transform: translateY(-50%) scale(0); }
        .seat-pos-6 .seat-bet-pill.visible { transform: translateY(-50%) scale(1); }
        .seat-pos-7 .seat-bet-pill { top: -28px; left: -24px; }

        .pot-pill {
            font-family: var(--font-sans);
            font-weight: 700;
            font-size: 12px;
            color: #000;
            background: var(--accent-orange);
            border-radius: var(--radius-pill);
            padding: 4px 10px;
            display: inline-block;
            opacity: 0;
            transform: scale(0);
            transition: opacity 0.4s, transform 0.4s;
        }
        .pot-pill.visible {
            opacity: 1;
            transform: scale(1);
        }

        .shot-clock {
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(0, 0, 0, 0.45);
            border-radius: var(--radius-pill);
            padding: 6px 20px;
            letter-spacing: 0.05em;
            line-height: 1;
            display: none;
            /* Extra gap between pill and community cards (parent flex gap is 10px). */
            margin-bottom: 10px;
        }
        /* When enabled, pill always occupies layout space so cards don't shift; */
        /* visibility toggles based on whether it's actively counting. */
        .shot-clock.enabled { display: inline-block; visibility: hidden; }
        .shot-clock.enabled.running { visibility: visible; }
        .shot-clock.expired { color: #ff5252; }

        .shotclock-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }
        .shotclock-seconds {
            background: var(--bg-tertiary);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            padding: 7px 10px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            width: 70px;
            text-align: center;
        }
        .shotclock-seconds:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        .shotclock-seconds:disabled {
            opacity: 0.4;
        }
        .shotclock-unit {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .seat-cards {
            position: absolute;
            display: flex;
            gap: 5px;
            z-index: 4;
            pointer-events: none;
        }

        .table-hole-card {
            width: 34px;
            height: 48px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: var(--font-sans);
            line-height: 1;
            box-shadow: 0 2px 8px rgba(0,0,0,0.35);
        }
        .seat-cards .table-hole-card {
            position: relative;
            z-index: 0;
        }

        .table-hole-card .rank {
            font-size: 22px;
            font-weight: 700;
        }

        .table-hole-card .suit {
            font-size: 22px;
        }

        .card.board-card {
            width: 34px;
            height: 48px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.35);
        }

        .card.board-card .rank { font-size: 22px; }
        .card.board-card .suit { font-size: 22px; }

        .card.board-card.facedown {
            width: 34px;
            height: 48px;
            background: var(--card-back);
            border: 1px solid rgba(255,255,255,0.35);
        }

        .table-hole-card.red {
            color: #d32f2f;
            background: #fff;
        }

        .table-hole-card.black {
            color: #1a1a1a;
            background: #fff;
        }

        .table-hole-card.back {
            background: var(--card-back);
            border: 1px solid rgba(255,255,255,0.35);
        }

        .table-hole-card.empty {
            display: none;
        }

        /* Keep cards to seat outer side (away from table center) */
        .seat-pos-0 .seat-cards,
        .seat-pos-1 .seat-cards,
        .seat-pos-2 .seat-cards,
        .seat-pos-3 .seat-cards,
        .seat-pos-4 .seat-cards {
            right: calc(100% + 2px);
            left: auto;
            top: 50%;
            bottom: auto;
            transform: translateY(-50%);
        }

        .seat-pos-5 .seat-cards,
        .seat-pos-6 .seat-cards,
        .seat-pos-7 .seat-cards {
            left: calc(100% + 2px);
            right: auto;
            top: 50%;
            bottom: auto;
            transform: translateY(-50%);
        }

        @keyframes foldCards {
            0%   { transform: translateY(-50%) scale(1); opacity: 1; }
            100% { transform: translateY(-50%) scale(0.2); opacity: 0; }
        }
        .seat-cards.folding {
            animation: foldCards 0.38s ease-in forwards;
        }

        /* Active turn ring override consolidated above in seat styles */

        /* During preflop animation, hide board cards and action buttons */
        .preflop-animating .board-cards { visibility: hidden; }
        .preflop-animating #actionButtons { visibility: hidden; }

        /* ===== MOBILE MODE ELEMENTS (hidden on desktop) ===== */
        .play-mode-header,
        .start-drilling-btn,
        .mobile-new-hand,
        .mobile-new-street {
            display: none;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 767px) {
            .hand-layout {
                flex-direction: column;
            }
            .poker-table-wrapper {
                padding: 28px 10px;
            }
            .table-felt {
                aspect-ratio: 0.58 / 1;
                width: min(100%, 460px);
            }
            .seat {
                width: 58px;
                height: 58px;
            }
            .seat-position {
                font-size: 12px;
                top: 0;
                width: 100%;
                text-align: center;
                line-height: 1.1;
            }
            .seat-stack {
                font-size: 12px;
                width: 100%;
                text-align: center;
                line-height: 1.1;
            }
            .seat-hero-label {
                bottom: -20px;
                font-size: 0.58rem;
            }
            .dealer-badge {
                width: 16px;
                height: 16px;
                font-size: 8px;
            }
            /* Mobile dealer button: place slightly farther toward table center */
            .seat-pos-0 .dealer-badge { top: -38px; left: 50%; transform: translateX(-50%); }
            .seat-pos-1 .dealer-badge { top: -24px; right: -20px; left: auto; }
            .seat-pos-2 .dealer-badge { top: 50%; right: -50px; left: auto; transform: translateY(-50%); }
            .seat-pos-3 .dealer-badge { bottom: -24px; right: -20px; left: auto; top: auto; }
            .seat-pos-4 .dealer-badge { bottom: -38px; left: 50%; top: auto; right: auto; transform: translateX(-50%); }
            .seat-pos-5 .dealer-badge { bottom: -24px; left: -20px; right: auto; top: auto; }
            .seat-pos-6 .dealer-badge { top: 50%; left: -50px; right: auto; transform: translateY(-50%); }
            .seat-pos-7 .dealer-badge { top: -24px; left: -20px; right: auto; }
            .table-hole-card {
                width: 40px;
                height: 56px;
            }
            .table-hole-card .rank {
                font-size: 20px;
            }
            .table-hole-card .suit {
                font-size: 15px;
            }
            .card.board-card {
                width: 40px;
                height: 56px;
            }
            .card.board-card .rank {
                font-size: 20px;
            }
            .card.board-card .suit {
                font-size: 15px;
            }
            .card.board-card.facedown {
                width: 40px;
                height: 56px;
            }
            /* Mobile: non-hero hidden cards shown as compact side marker (no bunny ears) */
            .seat:not(.hero) .seat-cards {
                top: 50% !important;
                transform: translateY(-50%) !important;
                gap: 0;
                z-index: 1;
            }
            .seat-pos-0:not(.hero) .seat-cards,
            .seat-pos-1:not(.hero) .seat-cards,
            .seat-pos-2:not(.hero) .seat-cards,
            .seat-pos-3:not(.hero) .seat-cards,
            .seat-pos-4:not(.hero) .seat-cards {
                right: calc(100% + 2px) !important;
                left: auto !important;
            }
            .seat-pos-5:not(.hero) .seat-cards,
            .seat-pos-6:not(.hero) .seat-cards,
            .seat-pos-7:not(.hero) .seat-cards {
                left: calc(100% + 2px) !important;
                right: auto !important;
            }
            .seat:not(.hero) .seat-position,
            .seat:not(.hero) .seat-stack,
            .seat:not(.hero) .seat-action {
                z-index: 2;
                position: relative;
            }
            .seat:not(.hero) .seat-position,
            .seat:not(.hero) .seat-stack,
            .seat:not(.hero) .seat-action {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 14px;
                white-space: nowrap;
                width: 100%;
                text-align: center;
            }
            .seat:not(.hero) .table-hole-card {
                width: 14px;
                height: 22px;
                border-radius: 4px;
                margin-left: -7px;
            }
            .seat:not(.hero) .table-hole-card:first-child {
                margin-left: 0;
            }
            .seat:not(.hero) .table-hole-card .rank {
                font-size: 0;
            }
            .seat:not(.hero) .table-hole-card .suit {
                font-size: 0;
            }
            /* Fold animation: shrink into center and disappear */
            @keyframes foldCardsMobile {
                0%   { transform: translateY(-50%) scale(1); opacity: 1; }
                100% { transform: translateY(-50%) translateX(10px) scale(0); opacity: 0; }
            }
            .seat:not(.hero) .seat-cards.folding {
                animation: foldCardsMobile 0.38s ease-in forwards !important;
            }
            .seat-pos-0 .seat-bet-pill { top: -38px; }
            .seat-pos-4 .seat-bet-pill { bottom: -38px; }
            .seat-pos-1 .seat-bet-pill { top: -24px; right: -20px; }
            .seat-pos-3 .seat-bet-pill { bottom: -24px; right: -20px; }
            .seat-pos-5 .seat-bet-pill { bottom: -24px; left: -20px; }
            .seat-pos-7 .seat-bet-pill { top: -24px; left: -20px; }
            .seat-pos-2 .seat-bet-pill { right: -50px; }
            .seat-pos-6 .seat-bet-pill { left: -50px; }
        }

        @media (max-width: 767px) {
            /* Mobile config base styles */
            .config-panel {
                padding: 12px;
            }
            .config-group {
                margin-bottom: 10px;
            }
            .config-btn {
                padding: 6px 10px;
                font-size: 0.8rem;
            }
            .control-bar {
                padding: 6px 0;
            }
            .new-hand-btn {
                padding: 10px 24px;
                font-size: 0.9rem;
                width: 100%;
            }

            /* ---- Setup mode (default on mobile) ---- */
            .app:not(.play-mode) .table-area {
                display: none;
            }
            .app:not(.play-mode) .play-mode-header {
                display: none;
            }
            .app:not(.play-mode) .sidebar {
                flex: 1;
                display: flex;
                flex-direction: column;
            }
            .app:not(.play-mode) .sidebar .new-hand-btn {
                display: none;
            }
            .app:not(.play-mode) .config-panel {
                flex: 1;
                display: flex;
                flex-direction: column;
            }
            .app:not(.play-mode) .config-body {
                display: flex !important;
                flex-direction: column;
                flex: 1;
            }
            .app:not(.play-mode) .start-drilling-btn {
                display: block;
                margin-top: auto;
                background: var(--accent-green);
                border: none;
                border-radius: var(--radius-lg);
                color: #fff;
                padding: 14px 32px;
                font-family: var(--font-sans);
                font-size: 1rem;
                font-weight: 700;
                cursor: pointer;
                width: 100%;
            }

            /* ---- Play mode ---- */
            .app.play-mode .sidebar {
                display: none;
            }
            .app.play-mode.setup-open .sidebar {
                display: flex;
                position: fixed;
                left: 12px;
                right: 12px;
                top: 56px;
                bottom: calc(12px + env(safe-area-inset-bottom, 0px));
                z-index: 20;
                overflow-y: auto;
                background: var(--bg-primary);
            }
            .app.play-mode.setup-open .sidebar > .new-hand-btn,
            .app.play-mode.setup-open .sidebar > .new-street-btn {
                display: none;
            }
            .app.play-mode.setup-open .config-panel {
                flex: 1;
                display: flex;
                flex-direction: column;
                margin-bottom: 0;
            }
            .app.play-mode.setup-open .config-body {
                display: flex !important;
                flex: 1;
                flex-direction: column;
            }
            .app.play-mode.setup-open .start-drilling-btn {
                display: block;
                margin-top: auto;
                width: 100%;
            }
            .app.play-mode .header {
                display: none;
            }
            .app.play-mode .play-mode-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 8px 16px;
                background: var(--bg-secondary);
                border-bottom: 1px solid rgba(255,255,255,0.1);
                font-family: var(--font-mono);
                font-size: 0.8rem;
                color: var(--text-secondary);
                flex-shrink: 0;
            }
            .play-mode-setup-btn {
                background: none;
                border: 1px solid rgba(255,255,255,0.2);
                border-radius: var(--radius-md);
                color: var(--text-secondary);
                font-family: var(--font-sans);
                font-size: 0.75rem;
                padding: 4px 10px;
                cursor: pointer;
            }
            .app.play-mode .main-layout {
                flex: 1;
            }
            .app.play-mode .table-area {
                flex: 1;
            }
            .app.play-mode.setup-open .table-area {
                display: none;
            }
            .app.play-mode .mobile-new-hand,
            .app.play-mode .mobile-new-street {
                display: block;
                width: 100%;
                padding: 10px 24px;
                font-size: 0.9rem;
            }
        }

        @media (min-width: 768px) {
            .app { padding: 24px; }

            /* Reserve side gutters so outer-anchored cards remain visible */
            .poker-table-wrapper {
                padding-left: clamp(76px, 6vw, 108px);
                padding-right: clamp(76px, 6vw, 108px);
            }

            /* Desktop layered seat model:
               cards < seat circle < seat text < active ring < HERO label */
            .seat {
                --seat-border-color: rgba(255,255,255,0.42);
                background: transparent;
                border-color: transparent;
            }
            .seat.hero { --seat-border-color: rgba(255, 214, 86, 0.85); }
            .seat.status-raised { --seat-border-color: rgba(255, 165, 0, 0.8); }
            .seat.status-called { --seat-border-color: rgba(88,166,255,0.8); }
            .seat.status-posted { --seat-border-color: rgba(255,255,255,0.55); }
            .seat.folded { --seat-border-color: rgba(255,255,255,0.28); }

            .seat::after {
                content: '';
                position: absolute;
                inset: 0;
                background: var(--bg-card);
                border-radius: 50%;
                border: 1.5px solid var(--seat-border-color);
                box-sizing: border-box;
                z-index: 2;
                pointer-events: none;
            }
            .seat .seat-cards {
                z-index: 1;
            }
            .seat > .seat-position,
            .seat > .seat-stack,
            .seat > .seat-action {
                position: relative;
                z-index: 30;
            }
            .dealer-badge { z-index: 35; }
            .seat-hero-label { z-index: 50; }
            .seat:not(.hero) .seat-cards {
                gap: 0;
            }
            .seat:not(.hero) .seat-cards .table-hole-card {
                margin-left: -20px;
            }
            .seat:not(.hero) .seat-cards .table-hole-card:first-child {
                margin-left: 0;
            }
            .seat.active-turn {
                border-color: transparent !important;
                box-shadow: none;
            }
            /* Desktop: sidebar layout */
            .main-layout {
                flex-direction: row;
                gap: 20px;
            }
            .sidebar {
                width: 330px;
                flex-shrink: 0;
                align-self: flex-start;
                position: sticky;
                top: 24px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }
            .config-body {
                display: flex !important;
            }
            .table-area {
                flex: 1;
                min-width: 0;
            }
            .table-actions-area {
                min-height: 120px;
                flex-shrink: 0;
            }

            .table-felt {
                aspect-ratio: 2 / 1;
            }
            .seat {
                width: clamp(64px, 5.5vw, 96px);
                height: clamp(64px, 5.5vw, 96px);
            }
            .seat-stack,
            .seat-action {
                font-size: clamp(13px, 1.1vw, 18px);
            }
            .seat-position {
                font-size: clamp(12px, 1vw, 16px);
            }
            .seat-hero-label {
                bottom: -24px;
                font-size: clamp(0.64rem, 0.9vw, 0.9rem);
                z-index: 50;
            }
            .table-hole-card {
                width: clamp(38px, 3.2vw, 56px);
                height: clamp(54px, 4.5vw, 80px);
            }
            .table-hole-card .rank {
                font-size: clamp(24px, 2vw, 34px);
            }
            .table-hole-card .suit {
                font-size: clamp(24px, 2vw, 34px);
            }
            .card { width: clamp(48px, 4vw, 72px); height: clamp(68px, 5.6vw, 100px); font-size: clamp(24px, 2vw, 34px); }
            .card .rank { font-size: clamp(24px, 2vw, 34px); }
            .card.board-card {
                width: clamp(38px, 3.2vw, 56px);
                height: clamp(54px, 4.5vw, 80px);
            }
            .card.board-card .rank { font-size: clamp(24px, 2vw, 34px); }
            .card.board-card .suit { font-size: clamp(24px, 2vw, 34px); }
            .card.board-card.facedown {
                width: clamp(38px, 3.2vw, 56px);
                height: clamp(54px, 4.5vw, 80px);
            }
            .seat-bet-pill {
                font-size: clamp(12px, 0.85vw, 14px);
                padding: clamp(3px, 0.25vw, 4px) clamp(8px, 0.6vw, 10px);
            }
            .pot-pill {
                font-size: clamp(15px, 1.1vw, 18px);
                padding: clamp(5px, 0.35vw, 6px) clamp(12px, 0.9vw, 16px);
            }
            .dealer-badge {
                width: clamp(22px, 1.5vw, 26px);
                height: clamp(22px, 1.5vw, 26px);
                font-size: clamp(11px, 0.75vw, 13px);
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>RTP Driller</h1>
            <div class="header-actions">
                <button class="btn-icon" id="btnSessionLog">History</button>
                <a href="/" class="btn-icon" style="text-decoration:none;">Home</a>
            </div>
        </div>

        <!-- MAIN LAYOUT: sidebar + table -->
        <div class="main-layout">
            <div class="play-mode-header" id="playModeHeader">
                <span id="playModeSummary">IP · SRP · 200bb · $2/$5</span>
                <button class="play-mode-setup-btn" id="btnChangeSetup">&#9881; Setup</button>
            </div>
            <!-- SIDEBAR: config + new hand button -->
            <div class="sidebar">
            <div class="config-panel" id="configPanel">
                <div class="config-body" id="configBody">
                    <div class="config-group">
                        <div class="config-label">Position</div>
                        <div class="config-options" id="positionOptions">
                            <button class="config-btn selected" data-value="IP">IP</button>
                            <button class="config-btn" data-value="OOP">OOP</button>
                        </div>
                    </div>

                    <div class="config-group">
                        <div class="config-label">Spot Type</div>
                        <div class="config-options" id="spotOptions">
                            <button class="config-btn" data-value="LIMP">Limp</button>
                            <button class="config-btn selected" data-value="SRP">SRP</button>
                            <button class="config-btn" data-value="3BP">3BP</button>
                            <button class="config-btn" data-value="4BP">4BP</button>
                        </div>
                    </div>

                    <div class="config-group">
                        <div class="config-label">Stack Depth</div>
                        <div class="config-options" id="stackOptions">
                            <button class="config-btn" data-value="100">100bb</button>
                            <button class="config-btn selected" data-value="200">200bb</button>
                            <button class="config-btn" data-value="300">300bb</button>
                            <button class="config-btn" data-value="400">400bb</button>
                        </div>
                    </div>

                    <div class="config-group">
                        <div class="config-label">Stakes</div>
                        <div class="config-options" id="stakesOptions">
                            <button class="config-btn" data-value="3">$1/$3</button>
                            <button class="config-btn selected" data-value="5">$2/$5</button>
                            <button class="config-btn" data-value="10">$5/$10</button>
                        </div>
                    </div>

                    <div class="config-group">
                        <div class="config-label">Shot Clock</div>
                        <div class="config-options" id="shotClockOptions">
                            <button class="config-btn selected" data-value="off">Off</button>
                            <button class="config-btn" data-value="on">On</button>
                        </div>
                        <div class="shotclock-row">
                            <input type="number" inputmode="numeric" min="5" max="300" step="5" class="shotclock-seconds" id="shotClockSeconds" value="30">
                            <span class="shotclock-unit">seconds per decision</span>
                        </div>
                    </div>
                    <button class="start-drilling-btn" id="btnStartDrilling">Start Drilling</button>
                </div>
            </div>
            <button class="new-hand-btn" id="btnNewHand">New Hand</button>
            <button class="new-street-btn" id="btnNewStreet">New Flop</button>
            <div class="history-nav" id="historyNav">
                <button class="history-nav-btn" id="btnHistoryBack" title="Step back" disabled>◀</button>
                <button class="history-nav-btn" id="btnHistoryForward" title="Step forward" disabled>▶</button>
            </div>
            </div>

            <!-- TABLE + ACTIONS -->
            <div class="table-area" id="tableArea">
                <div class="hand-layout">
                    <div class="hand-main">
                        <div class="poker-table-wrapper">
                            <div class="table-felt">
                                <div class="seat seat-pos-0" id="tableSeat0"></div>
                                <div class="seat seat-pos-1" id="tableSeat1"></div>
                                <div class="seat seat-pos-2" id="tableSeat2"></div>
                                <div class="seat seat-pos-3" id="tableSeat3"></div>
                                <div class="seat seat-pos-4" id="tableSeat4"></div>
                                <div class="seat seat-pos-5" id="tableSeat5"></div>
                                <div class="seat seat-pos-6" id="tableSeat6"></div>
                                <div class="seat seat-pos-7" id="tableSeat7"></div>
                                <div class="table-center">
                                    <div class="shot-clock" id="shotClock">0:30</div>
                                    <div class="board-cards" id="boardCards"></div>
                                    <div class="pot-pill" id="potPill">$0</div>
                                </div>
                            </div>
                        </div>
                        <div class="hero-hand" id="heroHand"></div>

                        <!-- CONTROL BAR: New Hand on mobile play mode -->
                        <div class="control-bar" id="controlBar">
                            <button class="history-nav-btn" id="btnHistoryBackMobile" title="Step back" disabled>◀</button>
                            <button class="new-hand-btn mobile-new-hand" id="btnNewHandMobile">New Hand</button>
                            <button class="new-street-btn mobile-new-street" id="btnNewStreetMobile">New Flop</button>
                            <button class="history-nav-btn" id="btnHistoryForwardMobile" title="Step forward" disabled>▶</button>
                        </div>

                        <div class="table-actions-area" id="actionsArea">
                            <div class="action-buttons" id="actionButtons"></div>
                            <div class="sizing-area" id="sizingArea">
                                <input type="number" inputmode="numeric" class="sizing-input" id="sizingInput" placeholder="Bet size in $" min="1" step="1">
                                <span class="sizing-unit">$</span>
                                <button class="sizing-confirm" id="sizingConfirm">Confirm</button>
                            </div>
                            <div class="sizing-error" id="sizingError"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SESSION LOG DRAWER -->
    <div class="session-overlay" id="sessionOverlay">
        <div class="session-drawer">
            <div class="drawer-header">
                <h2>Session Log</h2>
                <button class="drawer-close" id="drawerClose">&times;</button>
            </div>
            <div class="drawer-body" id="sessionLogBody">
                <div class="empty-state">No hands drilled yet this session.</div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
