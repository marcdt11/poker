name: Tests

# Server-side regression gate. Runs the Driller suite on every push to main and
# on every PR — unbypassable (unlike the local pre-push hook). Catches drifted
# pot/stack accounting before it reaches the deployed site.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
